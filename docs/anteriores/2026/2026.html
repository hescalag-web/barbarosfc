<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneos - Bárbaros FC</title>
  <link href="css/style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <section class="hero">
    <h3>Campeonato Apertura Entretiempo Senior +30 2026 (Finalizado)</h3>
  </section>

  <section class="hero">    
    <div id="fixture_Apertura2026" style="display:flex; justify-content:center; align-items:center;"></div><br>
    <div id="scorer_Apertura2026" style="display:flex; justify-content:center; align-items:center;"></div><br>
    <div id="statistics_Apertura2026"></div>
  </section>
  <!-- CARGA CSV TABLA GOLEADORES-->
  <script>
    async function cargarCSV() {
      const response = await fetch("docs/anteriores/2026/scorer_EntreTiempo_Apertura2026.csv");
      const text = await response.text();
      const rows = text.split("\n").map(r => r.split(","));

      let html = "<table class='tabla'>";
      rows.forEach((row, i) => {
        html += "<tr>";
          row.forEach(cell => {
            html += i === 0 
            ? `<th>${cell}</th>`
            : `<td>${cell}</td>`;
          });
          html += "</tr>";
      });
      html += "</table>";

      document.getElementById("scorer_Apertura2026").innerHTML = html;
    }
    // Ejecutar cuando cargue la página
    cargarCSV();
  </script>

  <!-- CARGA CSV TABLA ACTUAL FIXTURE-->
  <script>
    async function cargarCSV() {
      const response = await fetch("docs/anteriores/2026/fixture_EntreTiempo_Apertura2026.csv");
      const text = await response.text();
      const rows = text.split("\n").map(r => r.split(","));

      let html = "<table class='tabla'>";
      rows.forEach((row, i) => {

  <!-- CARGA CSV TABLA ESTADISTICAS ACTUAL ESTADISTICAS-FIXTURE-->
  <script>
    async function cargarEstadisticas() {
      const response = await fetch("docs/anteriores/2026/fixture_EntreTiempo_Apertura2026.csv");
      const text = await response.text();

      // Procesar CSV
      const rows = text.trim().split("\n").map(r => r.split(","));
      const data = rows.slice(1); // sin cabecera

      let jugados = 0, ganados = 0, empatados = 0, perdidos = 0;
      let golesFavor = 0, golesContra = 0;

      data.forEach(row => {
        jugados++
        const [fecha, resultado, rival, lugar] = row;
        const [gf, gc] = resultado.split("-").map(Number);

        golesFavor += gf;
        golesContra += gc;

        if (gf > gc) ganados++; 
        else if (gf < gc) perdidos++;
        else empatados++;
      });

      const diferencia = golesFavor - golesContra;
      const efectividad = ((ganados * 3 + empatados) / (jugados * 3) * 100).toFixed(1);
      // Generar HTML
      document.getElementById("statistics-Apertura2026").innerHTML = `
        <div class="estadisticas-box">
          <h2>📊 Estadísticas</h2>
          <ul>
            <li><strong>Partidos jugados:</strong> ${jugados}</li>
            <li><strong>Ganados:</strong> ${ganados}</li>
            <li><strong>Empatados:</strong> ${empatados}</li>
            <li><strong>Perdidos:</strong> ${perdidos}</li>
            <li><strong>Goles a favor:</strong> ${golesFavor}</li>
            <li><strong>Goles en contra:</strong> ${golesContra}</li>
            <li><strong>Diferencia de goles:</strong> ${diferencia}</li>
            <li><strong>Efectividad:</strong> ${efectividad}%</li>
          </ul>
        </div>
      `;
    }
    cargarEstadisticas();
  </script>
</body>
</html>
